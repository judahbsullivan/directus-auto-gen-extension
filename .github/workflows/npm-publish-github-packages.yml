# This workflow validates the package and publishes to npm with Trusted Publishing.

name: npm publish

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - run: npm install -g npm@11.5.1
      - run: npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm publish --access public
